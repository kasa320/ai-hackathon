<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>輪読会をつくる — 輪読運営エージェント</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Roboto+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

<!-- 背景の書棚。js/components/bookshelf.js が描く -->
<canvas id="backdrop" aria-hidden="true"></canvas>
<div class="backdrop-veil" aria-hidden="true"></div>

<!-- デモ用。本番ビルドでは丸ごと消す -->
<div class="demobar">
  <span class="demobar__tag" id="demo-mode">…</span>
  <span id="demo-controls"><span>入力内容は登録するまで保存されません</span></span>
  <span class="demobar__spacer">サーバー：<span id="health">確認中…</span></span>
</div>

<header class="topbar"><div class="topbar__inner" id="topbar"></div></header>

<div class="shell">
  <main class="main" id="main">
    <ol class="steps" id="steps"></ol>
    <p class="notice" id="notice" hidden></p>
    <section class="hero hero--work hero--split" id="wizard"></section>
  </main>
</div>

<script type="module" src="/js/setup.js"></script>
</body>
</html>
