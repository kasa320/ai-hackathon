<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <meta name="description" content="会の詳細。あなたの次の1件と、いまの案を確認します。">
  <title>会の詳細 — Marunage</title>
</head>
<body data-page="session">
  <div class="devbar" id="devbar" hidden></div>
  <header class="topbar" id="topbar"></header>

  <main class="shell">
    <a class="back" href="/">会の一覧へ戻る</a>
    <div id="flash" hidden></div>

    <div class="session-head" id="session-head"></div>

    <div class="split">
      <div>
        <section id="headline" class="headline" aria-live="polite"></section>
        <section id="proposals" aria-label="計画案"></section>
        <section id="answers" class="section" aria-label="参加条件"></section>
        <section id="activity" class="section" aria-label="実行記録" hidden></section>
      </div>
      <div class="aside">
        <section>
          <h3>エージェント</h3>
          <div id="agent"></div>
        </section>
        <section>
          <h3>通知</h3>
          <div id="notifications"></div>
        </section>
        <section>
          <h3>あなたができること</h3>
          <div id="my-actions"></div>
        </section>
        <section>
          <h3>この画面で共有される内容</h3>
          <p id="shared-note"></p>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="./js/session.js"></script>
</body>
</html>
