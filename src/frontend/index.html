<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <meta name="description" content="ひと言を投げるだけ。マルナゲが予定を聞き、輪読グループの日時と当日の進め方を決めます。">
  <title>グループ — Marunage</title>
</head>
<body data-page="home">
  <div class="devbar" id="devbar" hidden></div>
  <header class="topbar" id="topbar"></header>

  <!-- ホームの頭。全幅で使うので shell の外に置く。ログイン後は低くして出す -->
  <section class="hero" id="hero" hidden>
    <!-- 見出しが内容を伝えるので、写真は装飾として alt を空にする -->
    <div class="hero__media">
      <img src="./img/meeting-1600.jpg"
           srcset="./img/meeting-900.jpg 900w, ./img/meeting-1600.jpg 1600w"
           sizes="100vw" width="1600" height="1067" alt="" fetchpriority="high">
    </div>
    <div class="hero__in">
      <span class="hero__kicker">マルナゲ／幹事エージェント</span>
      <h1>日程調整は、<br>丸投げでいい。</h1>
      <p class="hero__lead">ひと言を投げるだけ。予定を聞き、日時と当日の進め方を決めます。</p>
      <div class="hero__actions">
        <a class="btn" id="login" href="/api/auth/discord">Discord ではじめる</a>
      </div>
    </div>
  </section>

  <main class="shell">
    <div id="flash" hidden></div>

    <!-- 未ログイン：雑なチャットが進行表になるまでを、実例で見せる -->
    <div id="guest" hidden>
      <section class="section">
        <div class="section__head">
          <h2>雑なひと言から、ここまで決まる</h2>
          <span class="headline__state">60分・4人の輪読セッション</span>
        </div>

        <p class="change">参加できる日、読んだ範囲、説明できる時間を集めて進行表を作ります。</p>

        <div class="plan plan--enter" style="margin-top:24px">
          <div class="plan__bar" role="img" aria-label="組み上がった進行表。復習20分、説明15分、議論25分。">
            <span style="flex:20"><b>復習</b>全員 20分</span>
            <span style="flex:15" data-tone="mid"><b>説明</b>Cさん 15分</span>
            <span style="flex:25"><b>議論</b>全員 25分</span>
          </div>
          <p class="plan__scale num"><span>0</span><span>20</span><span>35</span><span>60分</span></p>
        </div>

      </section>
    </div>

    <!-- ログイン後：あなたが返事をする1件を最初に置く -->
    <div id="member" hidden></div>
  </main>

  <script type="module" src="./js/index.js"></script>
</body>
</html>
